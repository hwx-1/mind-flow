# 宝塔 → 网站 → 你的站点 → 配置文件，把下面的 server 块整段替换
# 域名换成你自己的或服务器 IP

server {
    listen 80;
    server_name 39.96.36.94;

    # 客户端最大上传 200MB
    client_max_body_size 200M;

    # 文件目录（图片/视频）—— Nginx 直接出文件，速度比 Spring Boot 高
    location /static/ {
        alias /www/wwwroot/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # WebSocket
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8080/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSE 流式接口：关闭缓冲，否则 AI 流式会被一起返回
    location /api/ai/chat {
        proxy_pass http://127.0.0.1:8080/api/ai/chat;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Buffering  no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 其他 API
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        return 200 'mental-health server ok';
        add_header Content-Type text/plain;
    }

    access_log /www/wwwlogs/mental-health.log;
    error_log  /www/wwwlogs/mental-health.error.log;
}
